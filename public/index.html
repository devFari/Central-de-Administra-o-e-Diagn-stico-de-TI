<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Central de Administração de TI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>CMD na palma da mão</h1>
        <button class="btn btn-secondary btn-add-computador" id="btnAbrirModalAdd">➕ Adicionar Computador</button>
        <button id="btnLogout" class="btn btn-secondary" style="width: auto; padding: 0.5rem 1rem;">Sair</button>
    </header>

    <main>
        <div class="filters-bar">
            <div class="filter-item">
                <label for="filtroDepto">Departamento</label>
                <select id="filtroDepto">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="filter-item">
                <label for="filtroLocal">Localização</label>
                <select id="filtroLocal">
                    <option value="">Todas</option>
                </select>
            </div>
        </div>

        <div id="computersGrid" class="computers-grid">
            <!-- Os cards serão injetados dinamicamente via JS -->
        </div>

        <!-- Modal de Resultado Amigável -->
        <div id="resultModal" class="modal-overlay" style="display: none;">
            <div class="modal-content" style="max-width: 650px; width: 95%;">
                <div class="modal-header" id="resModalTitle" style="display: flex; justify-content: space-between; align-items: center;">
                    <span>Resultado da Operação</span>
                    <span id="resStatusBadge" style="font-size: 0.75rem; padding: 0.25rem 0.5rem; border-radius: 4px; background: #16a34a; color: white;">Sucesso</span>
                </div>
                <div class="modal-body">
                    <div id="resSummary">
                        <!-- Resumo para leigos -->
                    </div>
                    <div style="font-size: 0.8rem; font-weight: bold; color: var(--text-muted); margin-bottom: 0.25rem;">Detalhes técnicos do sistema:</div>
                    <div class="result-output" id="resRawOutput">
                        Aguardando...
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" id="btnFecharResModal">FECHAR</button>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal de Comandos -->
    <div id="commandModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header" id="modalPcTitle">Selecionar Operação</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="selectComando">Escolha uma operação:</label>
                    <select id="selectComando">
                        <option value="ping">Ping (Conectividade)</option>
                        <option value="tracert">Tracert (Rastreamento de rota)</option>
                        <option value="mstsc">MSTSC (Área de Trabalho Remota)</option>
                        <option value="nbtstat">NBTSTAT (Informações NetBIOS)</option>
                        <option value="net view">NET VIEW (Recursos Compartilhados)</option>
                        <option value="sc">SC (Serviços do Windows)</option>
                        <option value="tasklist">TASKLIST (Processos em Execução)</option>
                        <option value="taskkill">TASKKILL (Encerrar Processo)</option>
                        <option value="systeminfo">SYSTEMINFO (Informações do Sistema)</option>
                        <option value="shutdown">SHUTDOWN (Desligar / Reiniciar PC)</option>
                    </select>
                </div>
                <div class="form-group" id="extraParamGroup" style="display: none;">
                    <label id="extraParamLabel" for="extraParamInput">Parâmetro adicional:</label>
                    <input type="text" id="extraParamInput" placeholder="Ex: nome do processo ou serviço">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" id="btnCancelarModal">CANCELAR</button>
                <button type="button" class="btn" id="btnContinuarModal">CONTINUAR</button>
            </div>
        </div>
    </div>

    <!-- Modal Adicionar Computador -->
<div id="modalAddComputador" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 500px; width: 95%;">
        <div class="modal-header">
            <span>Adicionar Novo Computador</span>
        </div>
        <div class="modal-body">
            <form id="formAddComputador">
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text-muted);">Nome do Computador (Hostname):</label>
                    <input type="text" id="addNome" required placeholder="Ex: PC-TI-05" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text-muted);">Endereço IP (Opcional ou Fixo):</label>
                    <input type="text" id="addIp" placeholder="Ex: 192.168.1.50" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text-muted);">Departamento:</label>
                    <input type="text" id="addDepto" required placeholder="Ex: Suporte, Financeiro, CPD" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text-muted);">Usuário Responsável / Atual:</label>
                    <input type="text" id="addUser" required placeholder="Ex: João Silva" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);">
                </div>
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.85rem; margin-bottom: 0.3rem; color: var(--text-muted);">Localização / Sala:</label>
                    <input type="text" id="addLocal" required placeholder="Ex: Sala 02, Bloco B" style="width: 100%; padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color);">
                </div>
                <div id="addMsgError" style="color: var(--error-color); font-size: 0.85rem; margin-bottom: 1rem;"></div>
            </form>
        </div>
        <div class="modal-footer" style="display: flex; justify-content: flex-end; gap: 0.5rem;">
            <button type="button" class="btn" id="btnCancelarAdd" style="background: #64748b;">Cancelar</button>
            <button type="button" class="btn" id="btnSalvarAdd" style="background: #16a34a;">Salvar no Sistema</button>
        </div>
    </div>
</div>

    <footer>
        by DevFari
    </footer>

    <script src="js/interpreter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
